<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>leonix — print walkthrough</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="styles/base.css"/>

<link rel="stylesheet" href="styles/nav.css"/>

<link rel="stylesheet" href="styles/pages.css"/>
<style>
  /* ============== PRINT-SPECIFIC LAYOUT ============== */
  @page {
    size: 1280px 1800px;
    margin: 0;
  }

  html, body {
    background: var(--ink-900);
    color: var(--fg);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Disable subtle full-page grid that gets noisy in print */
  body::before { display: none !important; }

  .print-doc {
    width: 100%;
    background: var(--ink-900);
  }

  /* Each page is a fixed canvas, page-break after */
  .print-page,
  .print-cover {
    width: 1280px;
    min-height: 1800px;
    margin: 0 auto;
    background: var(--ink-900);
    position: relative;
    overflow: hidden;
    break-after: page;
    page-break-after: always;
    border-bottom: 1px dashed var(--hairline);
  }
  .print-page:last-child,
  .print-cover:last-child {
    break-after: auto;
    page-break-after: auto;
    border-bottom: 0;
  }

  /* Page chrome header */
  .print-page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 40px;
    border-bottom: 1px solid var(--hairline);
    background: var(--ink-900);
  }
  .ph-left { display: flex; gap: 18px; align-items: baseline; }
  .ph-title { font-family: var(--font-display); font-size: 18px; font-weight: 600; letter-spacing: -0.01em; color: var(--fg-strong); }
  .ph-right { font-size: 11px; }

  .print-page-body {
    /* Inherit normal app shell */
  }
  .print-main {
    /* No specific changes — the page content already lays itself out */
  }

  /* ===== Cover page ===== */
  .print-cover { padding: 80px 80px; display: flex; align-items: stretch; }
  .cover-grid {
    display: grid;
    grid-template-rows: auto auto auto auto auto 1fr;
    gap: 22px;
    width: 100%;
    align-content: start;
  }
  .cover-mark { color: var(--brand-500); }
  .cover-eyebrow { font-size: 12px; color: var(--fg-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .cover-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 88px;
    line-height: 0.98;
    letter-spacing: -0.03em;
    color: var(--fg-strong);
    max-width: 1000px;
    margin: 0;
    text-wrap: balance;
  }
  .cover-lede {
    font-size: 22px;
    line-height: 1.5;
    color: var(--fg-muted);
    max-width: 720px;
    margin: 0;
  }
  .cover-meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    padding-top: 28px;
    border-top: 1px solid var(--hairline);
    max-width: 800px;
  }
  .cover-meta > div { display: flex; flex-direction: column; gap: 4px; }
  .cover-meta .mono { font-size: 11px; }
  .cover-meta .strong { font-size: 18px; color: var(--fg-strong); font-weight: 500; }

  .cover-toc { margin-top: 24px; }
  .toc-head { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding-bottom: 12px; border-bottom: 1px solid var(--hairline); }
  .toc-list {
    list-style: none;
    padding: 16px 0 0 0;
    margin: 0;
    columns: 2;
    column-gap: 60px;
  }
  .toc-list li {
    display: flex;
    gap: 14px;
    align-items: baseline;
    padding: 6px 0;
    break-inside: avoid;
  }
  .toc-num { font-size: 11px; color: var(--fg-muted); width: 28px; flex-shrink: 0; }
  .toc-title { font-size: 14px; color: var(--fg-strong); }

  /* Make sure feature/lesson cards don't paint hover state */
  *:hover { transition: none !important; }

  /* Make absolutely positioned elements stay inside the printable area */
  .modal, .popover, .menu, .toast, .tweaks-panel { display: none !important; }

  /* keep main page content from clipping or scrolling */
  .app-root, main { overflow: visible !important; }

  /* prevent fixed nav from sticking — let it flow per page */
  .topnav { position: relative !important; top: auto !important; }

  /* Ensure interactive-only chrome (cmd-k, drawer triggers) doesn't cause weird states */
  .hide-mobile { display: revert !important; }
</style>
</head>

<div id="app"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app/ui.jsx"></script>
